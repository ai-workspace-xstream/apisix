# Non-sensitive values supplied by GitOps; secrets come from Vault separately.
apisix_pg_mode: sync
apisix_pg_home: /usr/local/apisix
apisix_pg_binary: /usr/bin/apisix
apisix_pg_apisix_service: apisix
apisix_pg_root: /opt/apisix-pg-standalone
apisix_pg_state: /var/lib/apisix-pg-sync/state.json
apisix_pg_environment_file: /run/apisix-pg-sync/environment
apisix_pg_api: https://gateway-config.example.net
apisix_pg_gateway: selfhost-uat
apisix_pg_probe: /opt/site/bin/verify-gateway-routes
apisix_pg_user: root
apisix_pg_group: root
apisix_pg_python: python3
# A native APISIX distribution must already be installed at apisix_pg_home.
